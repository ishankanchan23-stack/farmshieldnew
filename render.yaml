services:
  - type: web
    name: farmshield-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./farmshield.db
      - key: CORS_ORIGINS
        value: "*"
      - key: ACCESS_TOKEN_MINUTES
        value: 1440
      - key: UPLOAD_DIR
        value: uploads
      - key: MODEL_LABELS_PATH
        value: app/data/tomato_classes.json
      - key: RISK_RULES_PATH
        value: app/data/weather_risk_rules.json

  - type: web
    name: farmshield-frontend
    runtime: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: farmshield-api
          property: host
