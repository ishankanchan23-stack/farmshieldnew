services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farmshield
      POSTGRES_USER: farmshield
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmshield -d farmshield"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - farmshield-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      SECRET_KEY: local-compose-only-not-for-production-please-change
      DATABASE_URL: postgresql+psycopg://farmshield:local-development-only@db:5432/farmshield
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /app/uploads
      MODEL_LABELS_PATH: app/data/tomato_classes.json
      RISK_RULES_PATH: app/data/weather_risk_rules.json
    ports:
      - "8000:8000"
    volumes:
      - farmshield-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  farmshield-postgres:
  farmshield-uploads:
