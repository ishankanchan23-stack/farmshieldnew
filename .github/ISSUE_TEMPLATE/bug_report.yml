name: Bug report
description: Report a reproducible FarmShield issue
body:
  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: Do not include passwords, tokens, private farmer data, or uploaded images.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows, browser, Python and Node versions
    validations:
      required: true
